<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Privacy Policy</title>
    <meta name="color-scheme" content="dark">
    <style>
        @font-face {
            font-family: "Quicksand";
            src: url("/assets/Quicksand-VariableFont_wght.ttf") format("truetype");
            font-weight: 300 700;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg: #000;
            --fg: #fff;
            --pad: clamp(1.25rem, 5vw, 3rem);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: "Quicksand", system-ui, -apple-system, "Segoe UI", sans-serif;
            font-weight: 400;
            font-size: 1.0625rem;
            line-height: 1.7;
        }

        a {
            color: var(--fg);
        }

        a:focus-visible {
            outline: 2px solid var(--fg);
            outline-offset: 4px;
        }

        .logo-link {
            display: inline-block;
            margin-bottom: clamp(2rem, 6vw, 3.5rem);
            line-height: 0;
        }

        .logo {
            height: 2rem;
            width: auto;
            max-width: 100%;
        }

        main {
            max-width: 48rem;
            margin: 0 auto;
            padding: clamp(2rem, 8vw, 5rem) var(--pad) clamp(3rem, 10vw, 6rem);
        }

        h1 {
            margin: 0 0 clamp(2rem, 6vw, 4rem);
            font-size: clamp(2.5rem, 10vw, 5.5rem);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -0.02em;
            overflow-wrap: break-word;
        }

        section+section {
            margin-top: 2.5rem;
        }

        h2 {
            margin: 0 0 0.75rem;
            font-size: clamp(1.25rem, 4vw, 1.625rem);
            font-weight: 600;
            line-height: 1.3;
        }

        p {
            margin: 0 0 1rem;
        }

        p:last-child {
            margin-bottom: 0;
        }
    </style>
</head>

<body>
    <main>
        <a class="logo-link" href="/" aria-label="Home">
            <img class="logo" src="/assets/glidecom_logo_text.svg" alt="Glidecom">
        </a>

        <h1>Imprint</h1>

        <section>
            <h2>Contact</h2>
            <p>Email: finndev.contact@gmail.com</p>
        </section>
    </main>
</body>

</html>
