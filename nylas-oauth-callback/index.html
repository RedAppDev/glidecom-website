<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Login erfolgreich</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main>
    <h1>Login successful!</h1>

    <a id="continue-btn" class="continue-btn" aria-label="Weiter zur App">
      <img src="../assets/arrow_forward.svg" alt="" class="btn-icon" />
    </a>
  </main>

  <noscript>
    <p class="noscript-hint">
      JavaScript ist deaktiviert. Bitte kehre manuell zur App zurück.
    </p>
  </noscript>

  <script>
    (function () {
      var params = window.location.search;
      var appUrl = "com.finndev.glidecom://nylas-oauth-callback" + params;

      // Automatischer Redirect ins App Custom Scheme, sobald die Seite geladen ist
      window.location.href = appUrl;

      // Fallback-Button bekommt exakt dieselbe Custom-Scheme-URL
      var btn = document.getElementById("continue-btn");
      if (btn) {
        btn.href = appUrl;
      }
    })();
  </script>
</body>

</html>
